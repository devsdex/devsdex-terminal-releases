<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">devsdex terminal</title>
  <desc id="desc">Símbolo de terminal con degradado magenta y azul sobre un fondo carbón de esquinas redondeadas.</desc>
  <defs>
    <linearGradient id="tile" x1="180" y1="82" x2="800" y2="945" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252831"/><stop offset=".43" stop-color="#12151A"/><stop offset="1" stop-color="#090C10"/>
    </linearGradient>
    <radialGradient id="surface" cx="0" cy="0" r="1" gradientTransform="translate(320 160) rotate(58) scale(680 720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#444955" stop-opacity=".16"/><stop offset="1" stop-color="#080A0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="512" y1="84" x2="512" y2="938" gradientUnits="userSpaceOnUse">
      <stop stop-color="#727B91" stop-opacity=".76"/><stop offset=".16" stop-color="#444B5B" stop-opacity=".65"/><stop offset=".65" stop-color="#272D3A" stop-opacity=".48"/><stop offset="1" stop-color="#424A5D" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="innerRim" x1="120" y1="110" x2="860" y2="922" gradientUnits="userSpaceOnUse">
      <stop stop-color="#969DAA" stop-opacity=".23"/><stop offset=".3" stop-color="#4E566A" stop-opacity=".04"/><stop offset="1" stop-color="#697185" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="chevron" x1="263" y1="458" x2="548" y2="569" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F51BC6"/><stop offset=".38" stop-color="#D914F1"/><stop offset=".72" stop-color="#8234FF"/><stop offset="1" stop-color="#00B9F1"/>
    </linearGradient>
    <linearGradient id="cursor" x1="506" y1="668" x2="778" y2="668" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CA12F1"/><stop offset=".32" stop-color="#5140FE"/><stop offset=".67" stop-color="#008EFF"/><stop offset="1" stop-color="#00C9E9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="310" x2="0" y2="712" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
  </defs>
  <!-- Fully vector artwork. Outside the tile is transparent. -->
  <rect x="82" y="82" width="860" height="860" rx="182" fill="url(#tile)" stroke="#171B24" stroke-width="4"/>
  <rect x="87" y="87" width="850" height="850" rx="177" fill="url(#surface)" stroke="url(#rim)" stroke-width="5"/>
  <rect x="93" y="93" width="838" height="838" rx="171" stroke="url(#innerRim)" stroke-width="2"/>
  <!-- Prompt: the chevron and cursor remain independently editable. -->
  <path id="terminal-chevron" d="M282 313H368Q378 313 386 322L545 492Q555 503 545 514L385 686Q378 694 367 694H274Q252 694 262 673L416 503L270 341Q253 322 270 315Q275 313 282 313Z" fill="url(#chevron)" stroke="url(#edge)" stroke-width="1.5" stroke-linejoin="round"/>
  <rect id="terminal-cursor" x="506" y="628" width="270" height="81" rx="13" fill="url(#cursor)" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
